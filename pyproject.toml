[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "personal-ai-brain"
version = "0.1.0.dev0"
description = "Local-first personal knowledge, memory, and context infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Personal AI Brain contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/personal_ai_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
